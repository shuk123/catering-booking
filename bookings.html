<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibunda Booking</title>

<!-- Controls how this link looks when shared on WhatsApp/social apps. -->
<meta property="og:title" content="Ibunda Booking — Bookings List">
<meta property="og:description" content="Catering booking calendar for Ibunda Catering, Wedding & Event.">
<meta property="og:image" content="https://ibundabooking.netlify.app/assets/logo.jpg">
<meta property="og:url" content="https://ibundabooking.netlify.app/bookings.html">
<meta property="og:type" content="website">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="brand">
          <img src="assets/logo.jpg" alt="Ibunda Catering, Wedding & Event" class="logo">
          <div>
            <h1>Ibunda Bookings</h1>
            <p class="subtitle">Browse and filter all bookings</p>
          </div>
        </div>
        <nav class="page-nav">
          <a href="index.html" class="page-nav-link">Calendar</a>
          <a href="bookings.html" id="bookingsNavLink" class="page-nav-link active hidden">Bookings List</a>
          <a href="admin.html" id="adminNavLink" class="page-nav-link hidden">Admin</a>
        </nav>
      </div>
      <div id="authArea" class="auth-area">
        <div id="googleSignInBtn"></div>
        <div id="signedInAs" class="signed-in-as hidden">
          <span id="userEmailLabel"></span>
          <button id="signOutBtn" type="button" class="link-btn">Sign out</button>
        </div>
      </div>
    </div>
    <p id="syncStatus" class="sync-status"></p>
  </header>

  <main class="list-page">
    <div class="list-toolbar">
      <div id="venueFilters" class="venue-filters">
        <button type="button" class="filter-btn active" data-venue="all">All Bookings</button>
        <button type="button" class="filter-btn" data-venue="Ibunda Garden Hall">Ibunda Garden Hall</button>
        <button type="button" class="filter-btn" data-venue="Ibunda Mini Hall">Ibunda Mini Hall</button>
        <button type="button" class="filter-btn" data-venue="CSH A">CSH A</button>
        <button type="button" class="filter-btn" data-venue="others">Others</button>
      </div>
      <button type="button" id="printBtn" class="btn primary">Print / Save as PDF</button>
    </div>

    <div id="bookingsContainer"></div>
    <p id="emptyState" class="empty-state hidden">No bookings match this filter.</p>

    <div id="printView"></div>
  </main>
</div>

<div id="printOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>Print Bookings</h2>
      <button type="button" id="closePrintModal" class="close-btn" aria-label="Close">&times;</button>
    </div>

    <label for="printMonthSelect">Month</label>
    <select id="printMonthSelect">
      <option value="all">All months</option>
    </select>

    <label for="printVenueSelect">Venue</label>
    <select id="printVenueSelect">
      <option value="all">All venues</option>
      <option value="Ibunda Garden Hall">Ibunda Garden Hall</option>
      <option value="Ibunda Mini Hall">Ibunda Mini Hall</option>
      <option value="CSH A">CSH A</option>
      <option value="others">Others</option>
    </select>

    <div class="modal-actions">
      <div class="spacer"></div>
      <button type="button" id="cancelPrintModal" class="btn ghost">Cancel</button>
      <button type="button" id="confirmPrintBtn" class="btn primary">Print</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="bookings.js"></script>
</body>
</html>
